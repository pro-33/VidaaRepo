<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style type="text/css">
html {
    height: 100%;
}
body {
    background: #000000; /* Solid black background to eliminate any white edges */
    height: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}
/* Wrapper: removes any extra spacing */
#wrapper {
    padding: 0;
    margin: 0;
    line-height: 0;
}
/* Border container: completely stripped of all borders, backgrounds, and shadows */
#border {
    background: none;
    border: none;
    border-radius: 0;
    margin: 0;
    padding: 0;
    box-shadow: none;
    -webkit-box-shadow: none;
    -moz-box-shadow: none;
}
/* Canvas container: no spacing around canvas */
#canvas {
    width: 1280px;
    height: 720px;
    line-height: 0;
}
/* Canvas element: remove any shadow, outline, or possible white border */
#MMFCanvas {
    display: block;
    width: 1280px;
    height: 720px;
    -webkit-box-shadow: none;
    box-shadow: none;
    outline: none;
    border: 0;
}
/* Remove any possible focus outlines */
canvas:focus {
    outline: none;
}
/* Hide any leftover Clickteam related elements */
.clickteam-footer,
.footer-logo {
    display: none;
}
</style>
<title>FNAF HTML5 Runtime</title>
<script>
    // Detection of old browsers that do not support the canvas element
    if (!document.createElement("canvas").getContext) {
        window.open("http://www.clickteam.com/html5-fallback", "_self");
    }
</script>
<!-- Loads the Javascript runtime -->
<script src="src/Runtime.js"></script>
<script>
    // Detects if the html file is ran locally.
    if (window.location.protocol == "file:") {
        document.write('<div id="bloctxt">');
        document.write('<h1>The application cannot be run...</h1>');
        document.write('<p>HTML browsers do not allow you to launch data files directly from the file system.<br>');
        document.write('A drag & drop of the html file on a web-browser window will not work, on any machine.<br>');
        document.write('Please use the Build & Run option (it opens a local web server) to run your application,<br>') 
        document.write('or upload your application folder to a remote web-server, and start it from there...</p>');
        document.write('</div>');
        throw new Error("Cannot run application");
    }
</script>
</head>
<body>
<div id="wrapper">
    <div id="border">
        <div id="canvas">
            <canvas id="MMFCanvas" width="1280" height="720">
                <p>Your browser does not support Canvas.</p>
            </canvas>
        </div>
    </div>
</div>
<script>
    // RUNTIMESTART - start the HTML5 runtime
    window.addEventListener("load", windowLoaded, false);
    function windowLoaded() {
        // First parameter : canvas element ID
        // Second parameter : path to the cch file (images/sounds must be in resources folder)
        new Runtime("MMFCanvas", "resources/FNAF1HTML.cch");
    }
    // RUNTIMESTARTEND
</script>
<!-- All Clickteam branding, white borders, and footer elements have been removed -->
</body>
</html>
