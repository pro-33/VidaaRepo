<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Deluxe TV</title>
    <style>
        :root {
            --primary: #00ff95;
            --bg: #0a0a0a;
            --accent: #ff0055;
        }
        body { 
            margin: 0; 
            overflow: hidden; 
            background: var(--bg); 
            color: white; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            user-select: none;
        }
        canvas { 
            display: block; 
            background: linear-gradient(180deg, #1a1a2e 0%, #0a0a0a 100%);
            margin: 0 auto; 
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        #ui { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }
        .menu { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            background: rgba(15, 15, 25, 0.95); 
            padding: 40px; 
            text-align: center; 
            border: 2px solid var(--primary);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 149, 0.2);
            backdrop-filter: blur(10px);
            min-width: 300px;
        }
        h1 { margin-top: 0; color: var(--primary); letter-spacing: 3px; }
        button { 
            width: 100%;
            padding: 15px; 
            margin: 10px 0; 
            font-size: 18px; 
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer; 
            background: transparent;
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            transition: all 0.2s;
        }
        button:hover, button:focus { 
            background: var(--primary); 
            color: #000;
            transform: scale(1.05);
            outline: none;
        }
        .btn-exit { border-color: var(--accent); color: var(--accent); }
        .btn-exit:hover { background: var(--accent); color: white; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="ui">LEVEL <span id="lvl">1</span> — ATTEMPT <span id="att">1</span></div>

<div id="main-menu" class="menu">
    <h1>GEOMETRY DASH</h1>
    <button onclick="startGame(0)">Stereo Madness</button>
    <button onclick="startGame(1)">Back on Track</button>
    <button onclick="startGame(2)">Polargeist</button>
    <button onclick="exitApp()" class="btn-exit">ВЫХОД</button>
</div>

<div id="pause-menu" class="menu hidden">
    <h1>PAUSED</h1>
    <button onclick="resumeGame()">ПРОДОЛЖИТЬ</button>
    <button onclick="backToMenu()">В МЕНЮ</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Адаптация размера под экран
canvas.width = window.innerWidth > 1280 ? 1280 : window.innerWidth;
canvas.height = 600;

let gameState = 'MENU';
let currentLvl = 0;
let attempts = 1;
let paused = false;
let gameSpeed = 7;

const player = {
    x: 150, y: 450, w: 40, h: 40,
    dy: 0, jumpForce: -14, gravity: 0.9,
    grounded: false, rotation: 0,
    color: '#00ff95'
};

const levels = [
    [0,0,0,1,0,2,0,1,1,0,2,2,0,1,0,2,0,1,0,2,0,1,2,0,1,1,1,2],
    [0,1,2,1,0,2,2,1,0,1,2,1,2,0,1,2,2,0,1,2,1,2,1,0,2,2,2,1],
    [0,2,2,1,2,2,1,2,2,1,0,2,2,2,1,2,2,2,1,2,2,2,1,2,2,1,2,2]
];

let obstacles = [];

function initLevel(idx) {
    obstacles = [];
    levels[idx].forEach((type, i) => {
        if (type > 0) {
            obstacles.push({ x: 800 + i * 250, type: type, w: 40, h: 40 });
        }
    });
}

function startGame(idx) {
    currentLvl = idx;
    attempts = 1;
    document.getElementById('att').innerText = attempts;
    resetPlayer();
    initLevel(idx);
    gameState = 'PLAY';
    document.getElementById('main-menu').classList.add('hidden');
    document.getElementById('lvl').innerText = idx + 1;
}

function resetPlayer() {
    player.y = 450;
    player.dy = 0;
    player.rotation = 0;
}

function exitApp() {
    if (window.history.length > 1) window.history.back();
    else window.location.href = "about:blank";
}

function togglePause() {
    if (gameState !== 'PLAY') return;
    paused = !paused;
    document.getElementById('pause-menu').classList.toggle('hidden', !paused);
}

function resumeGame() {
    paused = false;
    document.getElementById('pause-menu').classList.add('hidden');
}

function backToMenu() {
    paused = false;
    gameState = 'MENU';
    document.getElementById('pause-menu').classList.add('hidden');
    document.getElementById('main-menu').classList.remove('hidden');
}

// ПРЫЖОК
function jump() {
    if (gameState === 'PLAY' && !paused && player.grounded) {
        player.dy = player.jumpForce;
        player.grounded = false;
    }
}

// УПРАВЛЕНИЕ: Клавиатура + Пульт
window.addEventListener('keydown', (e) => {
    if ([13, 38, 32].includes(e.keyCode)) jump();
    if ([461, 27, 8].includes(e.keyCode)) {
        e.preventDefault();
        togglePause();
    }
});

// УПРАВЛЕНИЕ: Мышь и Тач
window.addEventListener('mousedown', (e) => {
    if (e.target.tagName !== 'BUTTON') jump();
});
window.addEventListener('touchstart', (e) => {
    if (e.target.tagName !== 'BUTTON') jump();
});

function update() {
    if (gameState !== 'PLAY' || paused) return;

    player.dy += player.gravity;
    player.y += player.dy;

    const floorY = canvas.height - 100;

    if (player.y + player.h > floorY) {
        player.y = floorY - player.h;
        player.dy = 0;
        player.grounded = true;
        player.rotation = Math.round(player.rotation / 90) * 90;
    } else {
        player.rotation += 4;
    }

    obstacles.forEach(obs => {
        obs.x -= gameSpeed;

        // Коллизия (упрощенная для динамики)
        if (player.x < obs.x + obs.w - 5 && player.x + player.w - 5 > obs.x &&
            player.y < floorY && player.y + player.h > floorY - obs.h + 5) {
                attempts++;
                document.getElementById('att').innerText = attempts;
                initLevel(currentLvl);
                resetPlayer();
        }
    });

    if (obstacles.length > 0 && obstacles[obstacles.length-1].x < -100) {
        alert("Уровень пройден!");
        backToMenu();
    }
}

function draw() {
    // Очистка фона с легким шлейфом
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Рисуем сетку на фоне для красоты
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for(let i=0; i<canvas.width; i+=50) {
        ctx.beginPath(); ctx.moveTo(i - (Date.now()/20 % 50), 0); ctx.lineTo(i - (Date.now()/20 % 50), canvas.height); ctx.stroke();
    }

    const floorY = canvas.height - 100;

    // Пол с градиентом
    let floorGrad = ctx.createLinearGradient(0, floorY, 0, canvas.height);
    floorGrad.addColorStop(0, '#1a1a2e');
    floorGrad.addColorStop(1, '#000');
    ctx.fillStyle = floorGrad;
    ctx.fillRect(0, floorY, canvas.width, 100);
    ctx.strokeStyle = player.color;
    ctx.lineWidth = 3;
    ctx.strokeRect(-10, floorY, canvas.width + 20, 1);

    if (gameState === 'PLAY') {
        // Игрок (Свечение)
        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = player.color;
        ctx.translate(player.x + player.w/2, player.y + player.h/2);
        ctx.rotate(player.rotation * Math.PI / 180);
        ctx.fillStyle = player.color;
        ctx.fillRect(-player.w/2, -player.h/2, player.w, player.h);
        // Глаза кубика
        ctx.fillStyle = 'black';
        ctx.fillRect(5, -15, 8, 8);
        ctx.fillRect(5, 5, 8, 8);
        ctx.restore();

        // Препятствия
        obstacles.forEach(obs => {
            if (obs.type === 1) { // Блок
                ctx.fillStyle = '#444';
                ctx.shadowBlur = 0;
                ctx.fillRect(obs.x, floorY - obs.h, obs.w, obs.h);
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.strokeRect(obs.x + 5, floorY - obs.h + 5, obs.w - 10, obs.h - 10);
            } else if (obs.type === 2) { // Шип
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff0055';
                ctx.fillStyle = '#ff0055';
                ctx.beginPath();
                ctx.moveTo(obs.x, floorY);
                ctx.lineTo(obs.x + obs.w/2, floorY - obs.h);
                ctx.lineTo(obs.x + obs.w, floorY);
                ctx.fill();
            }
        });
    }
    
    update();
    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
