<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GD Ultra TV Edition</title>
    <style>
        :root { --primary: #00ff95; --bg: #0a0a0a; }
        body { margin: 0; overflow: hidden; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; user-select: none; }
        canvas { display: block; background: linear-gradient(180deg, #1a1a2e 0%, #050505 100%); margin: 0 auto; }
        
        /* Меню */
        .menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                background: rgba(15, 15, 25, 0.98); padding: 30px; text-align: center; 
                border: 2px solid var(--primary); border-radius: 15px; min-width: 350px; backdrop-filter: blur(15px); }
        
        .level-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        
        button { background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.2);
                 padding: 12px; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.2s; position: relative; }
        button:hover, button:focus { background: var(--primary); color: #000; outline: none; transform: scale(1.03); }
        
        .star { color: #ffd700; font-size: 14px; margin-left: 5px; }
        
        /* Выбор цвета */
        .color-picker { display: flex; justify-content: center; gap: 10px; margin: 15px 0; }
        .color-opt { width: 30px; height: 30px; border-radius: 5px; border: 2px solid #fff; cursor: pointer; }
        .color-opt.active { transform: scale(1.2); border-color: var(--primary); box-shadow: 0 0 10px var(--primary); }

        /* UI в игре */
        #top-ui { position: absolute; top: 10px; width: 100%; text-align: center; font-size: 20px; font-weight: bold; pointer-events: none; }
        #pause-btn { position: absolute; top: 10px; right: 10px; padding: 5px 15px; background: rgba(0,0,0,0.5); border-radius: 5px; cursor: pointer; border: 1px solid #fff; }
        
        .progress-container { width: 100%; background: rgba(255,255,255,0.1); height: 10px; border-radius: 5px; margin: 15px 0; overflow: hidden; }
        #progress-bar { height: 100%; background: var(--primary); width: 0%; transition: 0.1s; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="top-ui" class="hidden">ATTEMPT <span id="att-val">1</span></div>
<div id="pause-btn" class="hidden" onclick="togglePause()">ПАУЗА (ESC)</div>

<!-- ГЛАВНОЕ МЕНЮ -->
<div id="main-menu" class="menu">
    <h1 style="color:var(--primary); margin-bottom:5px;">GEOMETRY DASH</h1>
    <p style="font-size:12px; opacity:0.6;">SELECT LEVEL & CUBE COLOR</p>
    
    <div class="color-picker" id="cube-colors"></div>

    <div class="level-grid">
        <button onclick="startGame(0)">1. Stereo <span id="s0"></span></button>
        <button onclick="startGame(1)">2. Track <span id="s1"></span></button>
        <button onclick="startGame(2)">3. Polar <span id="s2"></span></button>
        <button onclick="startGame(3)">4. Dry Out <span id="s3"></span></button>
        <button onclick="startGame(4)">5. Base <span id="s4"></span></button>
        <button onclick="exitApp()" style="color:#ff4444; grid-column: span 2;">ВЫХОД</button>
    </div>
</div>

<!-- МЕНЮ ПАУЗЫ -->
<div id="pause-menu" class="menu hidden">
    <h1 id="pause-title">ПАУЗА</h1>
    <div class="progress-container"><div id="progress-bar"></div></div>
    <p id="progress-text">Прогресс: 0%</p>
    <button onclick="resumeGame()" style="width:100%">ПРОДОЛЖИТЬ</button>
    <button onclick="backToMenu()" style="width:100%; margin-top:10px;">В МЕНЮ (ВЫХОД)</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let gameState = 'MENU';
let currentLvl = 0;
let attempts = 1;
let paused = false;
let gameSpeed = 8;
let winTriggered = false;

// Данные игрока
const player = {
    x: 150, y: 0, w: 45, h: 45,
    dy: 0, jumpForce: -15, gravity: 1.0,
    grounded: false, rotation: 0, color: '#00ff95'
};

const colors = ['#00ff95', '#00d9ff', '#ffff00', '#ff00ff', '#ffffff', '#ff4444'];
let selectedColor = localStorage.getItem('cubeColor') || colors[0];

// Генерация уровней (разнообразие)
// 1-блок, 2-шип, 3-двойной шип, 4-высокий блок
const levelData = [
    [0,0,1,0,2,0,0,1,1,2,0,1,2,0,0,2,2,0,1,1,1,2,0,2,2],
    [0,1,2,0,1,2,2,0,1,4,0,2,2,1,0,4,4,0,2,2,2,0,1,1,2,2,2],
    [0,2,1,2,0,4,2,0,4,2,0,1,1,2,2,1,1,2,2,4,0,2,2,2,1,2,2,2],
    [0,1,4,1,2,2,0,4,4,2,2,0,1,2,1,2,1,2,0,4,2,2,4,2,2,1,2,2],
    [0,2,2,2,1,4,2,2,1,4,2,2,0,4,4,4,2,2,2,1,2,2,1,2,2,1,2,2,2]
];

let obstacles = [];
let levelLength = 0;

function initUI() {
    const container = document.getElementById('cube-colors');
    container.innerHTML = '';
    colors.forEach(c => {
        const div = document.createElement('div');
        div.className = `color-opt ${c === selectedColor ? 'active' : ''}`;
        div.style.background = c;
        div.onclick = () => {
            selectedColor = c;
            player.color = c;
            localStorage.setItem('cubeColor', c);
            initUI();
        };
        container.appendChild(div);
    });

    for(let i=0; i<5; i++) {
        if(localStorage.getItem('lvl_'+i)) {
            document.getElementById('s'+i).innerHTML = '<span class="star">★</span>';
        }
    }
}

function initLevel(idx) {
    obstacles = [];
    winTriggered = false;
    levelData[idx].forEach((type, i) => {
        let x = 800 + i * 300;
        if (type === 1) obstacles.push({x, y: 0, w: 50, h: 50, type: 1}); // Блок
        if (type === 2) obstacles.push({x, y: 0, w: 50, h: 50, type: 2}); // Шип
        if (type === 3) { // Двойной шип
            obstacles.push({x, y: 0, w: 50, h: 50, type: 2});
            obstacles.push({x: x+50, y: 0, w: 50, h: 50, type: 2});
        }
        if (type === 4) obstacles.push({x, y: 0, w: 50, h: 100, type: 1}); // Высокий блок
    });
    levelLength = 800 + levelData[idx].length * 300;
}

function startGame(idx) {
    currentLvl = idx;
    attempts = 1;
    player.color = selectedColor;
    resetPlayer();
    initLevel(idx);
    gameState = 'PLAY';
    document.getElementById('main-menu').classList.add('hidden');
    document.getElementById('top-ui').classList.remove('hidden');
    document.getElementById('pause-btn').classList.remove('hidden');
    document.getElementById('att-val').innerText = attempts;
}

function resetPlayer() {
    player.y = canvas.height - 150;
    player.dy = 0;
    player.rotation = 0;
}

function togglePause() {
    if (gameState !== 'PLAY' || winTriggered) return;
    paused = !paused;
    if(paused) {
        let prog = Math.floor((Math.abs(obstacles[0]?.x - 800) / levelLength) * 100);
        if (prog < 0) prog = 0;
        document.getElementById('progress-bar').style.width = prog + '%';
        document.getElementById('progress-text').innerText = `Прогресс: ${prog}%`;
    }
    document.getElementById('pause-menu').classList.toggle('hidden', !paused);
}

function resumeGame() { paused = false; document.getElementById('pause-menu').classList.add('hidden'); }

function backToMenu() {
    paused = false;
    gameState = 'MENU';
    document.getElementById('main-menu').classList.remove('hidden');
    document.getElementById('pause-menu').classList.add('hidden');
    document.getElementById('top-ui').classList.add('hidden');
    document.getElementById('pause-btn').classList.add('hidden');
    initUI();
}

function exitApp() {
    if (window.history.length > 1) window.history.back();
    else window.location.href = "about:blank";
}

function jump() {
    if (gameState === 'PLAY' && !paused && player.grounded) {
        player.dy = player.jumpForce;
        player.grounded = false;
    }
}

// Слушатели событий
window.addEventListener('keydown', (e) => {
    if ([13, 38, 32].includes(e.keyCode)) jump();
    if ([461, 27, 8].includes(e.keyCode)) { e.preventDefault(); togglePause(); }
});
window.addEventListener('mousedown', (e) => { if(e.target.id === 'gameCanvas') jump(); });

function update() {
    if (gameState !== 'PLAY' || paused) return;

    player.dy += player.gravity;
    player.y += player.dy;

    const groundY = canvas.height - 100;

    if (player.y + player.h > groundY) {
        player.y = groundY - player.h;
        player.dy = 0;
        player.grounded = true;
        player.rotation = Math.round(player.rotation / 90) * 90;
    } else {
        player.rotation += 5;
    }

    obstacles.forEach(obs => {
        obs.x -= gameSpeed;
        
        // Коллизия
        if (player.x < obs.x + obs.w - 10 && player.x + player.w - 10 > obs.x &&
            player.y + player.h > groundY - obs.h + 10) {
            attempts++;
            document.getElementById('att-val').innerText = attempts;
            initLevel(currentLvl);
            resetPlayer();
        }
    });

    if (obstacles.length > 0 && obstacles[obstacles.length-1].x < -200 && !winTriggered) {
        winTriggered = true;
        localStorage.setItem('lvl_' + currentLvl, 'true');
        alert("УРОВЕНЬ ПРОЙДЕН!");
        backToMenu();
    }
}

function draw() {
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const groundY = canvas.height - 100;

    // Сетка
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    for(let i=0; i<canvas.width; i+=60) {
        ctx.beginPath(); ctx.moveTo(i - (Date.now()/15 % 60), 0); ctx.lineTo(i - (Date.now()/15 % 60), canvas.height); ctx.stroke();
    }

    // Пол
    ctx.fillStyle = '#111';
    ctx.fillRect(0, groundY, canvas.width, 100);
    ctx.strokeStyle = player.color;
    ctx.lineWidth = 4;
    ctx.strokeRect(0, groundY, canvas.width, 2);

    if (gameState === 'PLAY') {
        // Игрок
        ctx.save();
        ctx.shadowBlur = 20;
        ctx.shadowColor = player.color;
        ctx.translate(player.x + player.w/2, player.y + player.h/2);
        ctx.rotate(player.rotation * Math.PI / 180);
        ctx.fillStyle = player.color;
        ctx.fillRect(-player.w/2, -player.h/2, player.w, player.h);
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.strokeRect(-player.w/2 + 5, -player.h/2 + 5, player.w - 10, player.h - 10);
        ctx.restore();

        // Препятствия
        obstacles.forEach(obs => {
            if (obs.type === 1) { // Блок
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#333';
                ctx.fillRect(obs.x, groundY - obs.h, obs.w, obs.h);
                ctx.strokeStyle = '#666';
                ctx.strokeRect(obs.x, groundY - obs.h, obs.w, obs.h);
            } else { // Шип
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff0055';
                ctx.fillStyle = '#ff0055';
                ctx.beginPath();
                ctx.moveTo(obs.x, groundY);
                ctx.lineTo(obs.x + obs.w/2, groundY - obs.h);
                ctx.lineTo(obs.x + obs.w, groundY);
                ctx.fill();
            }
        });
    }

    update();
    requestAnimationFrame(draw);
}

initUI();
draw();
</script>
</body>
</html>
